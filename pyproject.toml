[project]
name = "dokumentanya"
version = "0.1.0"
description = "Document AI workspace with OCR, hybrid retrieval, verifiable citations, and versioned corrections."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3", "python-multipart>=0.0.18,<1",
  "pdfplumber>=0.11,<1", "pypdfium2>=4.30,<6", "pillow>=10,<13",
  "rank-bm25>=0.2.2,<1", "httpx>=0.27,<1", "itsdangerous>=2.2,<3",
  "qdrant-client>=1.14,<2", "redis>=5,<7", "rq>=2,<3",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3,<4", "onnxruntime>=1.19,<2"]
ai = ["docling>=2.50,<3", "sentence-transformers>=3,<6", "google-genai>=1,<2"]
dev = ["pytest>=8,<10", "reportlab>=4,<5", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
