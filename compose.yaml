x-environment: &app-environment
  DATA_DIR: /app/data
  JOB_BACKEND: rq
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  PARSER_BACKEND: ${PARSER_BACKEND:-pdfplumber}
  OCR_ENABLED: ${OCR_ENABLED:-true}
  OCR_ENGINE: ${OCR_ENGINE:-rapidocr}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-none}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
  LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
  SESSION_SECRET: ${SESSION_SECRET:-}
  SECURE_COOKIE: ${SECURE_COOKIE:-false}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
  MAX_PAGES: ${MAX_PAGES:-50}

services:
  api:
    build:
      context: .
      args:
        INSTALL_AI: ${INSTALL_AI:-false}
    image: dokumentanya:local
    ports: ["127.0.0.1:8000:8000"]
    environment: *app-environment
    volumes: ["app-data:/app/data", "model-cache:/app/model-cache"]
    depends_on:
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    image: dokumentanya:local
    command: ["python", "-m", "backend.app.worker"]
    environment: *app-environment
    volumes: ["app-data:/app/data", "model-cache:/app/model-cache"]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes: ["qdrant-data:/qdrant/storage"]
    restart: unless-stopped
volumes:
  app-data:
  model-cache:
  redis-data:
  qdrant-data:
