name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --frozen --extra dev ruff check backend tests scripts evals
      - run: uv run --frozen --extra dev pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for file in frontend/assets/js/*.js; do node --check "$file"; done
